version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: healthcare_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: healthcare_backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/healthcare_platform
      JWT_SECRET_KEY: production_jwt_secret_key_change_me_in_real_deploy
      AI_PROVIDER: mock_local
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
