# Render Blueprint — backend API + Postgres
# Dashboard: New → Blueprint → connect this repo
# After the API is live, set NEXT_PUBLIC_API_URL on Netlify to:
#   https://<this-service>.onrender.com/api/v1

databases:
  - name: sachiva-db
    databaseName: healthcare_platform
    user: sachiva
    plan: basic-256mb

services:
  - type: web
    name: sachiva-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_production.py
    healthCheckPath: /api/v1/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: mock_local
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sachiva-db
          property: connectionString
